services:
  - type: web
    name: naap-parking-management
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GUARD_USERNAME
        sync: false
      - key: GUARD_PASSWORD
        sync: false
      - key: REQUIRE_ADMIN_2FA
        value: "true"
      - key: GUARD_INACTIVITY_DAYS
        value: "120"
      - key: SNAPSHOT_RETENTION_DAYS
        value: "30"
      - key: SCAN_LOG_RETENTION_DAYS
        value: "365"
      - key: SECURITY_AUDIT_RETENTION_DAYS
        value: "730"
      - key: SCANNER_METRIC_RETENTION_DAYS
        value: "90"
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
